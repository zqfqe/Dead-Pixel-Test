<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="Hhbf5ZqIXEGRs_NaTldov7TD0zGNRiM43_cX-ywm4mM" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Free dead pixel test with full-screen solid colors. Inspect your monitor, laptop or phone for dead and stuck pixels; no download needed." />
    
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>Dead Pixel Test – Free Online Screen Check | DeadPixelTest</title>
    
    <!-- Critical CSS for App Shell (Loading State) -->
    <style>
      body, html { margin: 0; padding: 0; background-color: #000000; height: 100%; width: 100%; }
      #app-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        color: white;
        font-family: system-ui, -apple-system, sans-serif;
        z-index: 9999;
      }
      .loading-logo {
        width: 64px;
        height: 64px;
        margin-bottom: 24px;
        animation: pulse 2s infinite ease-in-out;
      }
      .loading-text {
        font-size: 14px;
        color: #444;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-weight: 600;
        animation: fade 2s infinite ease-in-out;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.95); opacity: 0.7; }
      }
      @keyframes fade {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.7; }
      }
    </style>\n</head>
  <body>
    <div id="root">
      <!-- App Shell / Loading State -->
      <!-- This content is instantly visible and will be replaced by React when loaded -->
      <div id="app-loading">
        <svg class="loading-logo" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="512" height="512" rx="128" fill="white"/>
          <rect x="96" y="96" width="144" height="144" rx="32" fill="#171717"/>
          <rect x="272" y="96" width="144" height="144" rx="32" fill="#171717"/>
          <rect x="96" y="272" width="144" height="144" rx="32" fill="#171717"/>
          <rect x="272" y="272" width="144" height="144" rx="32" fill="#EF4444"/>
        </svg>
        <div class="loading-text">Loading Tools...</div>
      </div>
    </div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>

name: Live Production HTTP and SEO Smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live canonical pages, index rules, sitemap and redirects
        env:
          PUBLIC_SITE_URL: https://deadpixeltest.cc
        run: node scripts/production-smoke.mjs
      - name: Install dependencies for optional live browser sweep
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: npm install --no-audit --no-fund
      - name: Install Chromium for optional live browser sweep
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: npx playwright install --with-deps chromium
      - name: Test live user interactions after deployment
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          PUBLIC_SITE_URL: https://deadpixeltest.cc
          SMOKE_BASE: https://deadpixeltest.cc
        run: npm run smoke:browser

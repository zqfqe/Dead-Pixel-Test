name: Production Domain Smoke (configured origin only)
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  production-smoke:
    if: ${{ vars.PUBLIC_SITE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify configured production domain
        if: ${{ vars.PUBLIC_SITE_URL != '' }}
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: node scripts/production-smoke.mjs
      - name: Install Chromium
        if: ${{ vars.PUBLIC_SITE_URL != '' }}
        run: npx playwright install --with-deps chromium
      - name: Test production interactions
        if: ${{ vars.PUBLIC_SITE_URL != '' }}
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          SMOKE_BASE: ${{ vars.PUBLIC_SITE_URL }}
        run: npm run smoke:browser

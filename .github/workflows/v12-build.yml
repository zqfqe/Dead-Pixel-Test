name: Astro Static Build and SEO Routes
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck application
        run: npm run check:types
      - name: Verify reciprocal language and index-admission gates
        run: npx --no-install tsx scripts/test-hreflang-gates.ts
      - name: Build domainless safe deployment
        run: npm run build
      - name: Audit noindex and route output without a domain
        run: node scripts/audit-astro-build.mjs
      - name: Cloudflare preview must remain noindex even with production origin available
        env:
          PUBLIC_SITE_URL: https://deadpixeltest.example
          CF_PAGES: '1'
          CF_PAGES_BRANCH: feature/review-preview
        run: |
          npm run build
          grep -q 'name="robots" content="noindex,nofollow"' dist/index.html
          ! grep -q 'rel="canonical"' dist/index.html
          ! grep -q '<loc>' dist/sitemap.xml
          ! grep -q 'Sitemap:' dist/robots.txt
          grep -q 'X-Robots-Tag: noindex' dist/_headers
          grep -q 'noindex,nofollow' dist/pt-br.html
      - name: Cloudflare production main must be indexable without dashboard variable
        env:
          CF_PAGES: '1'
          CF_PAGES_BRANCH: main
        run: |
          npm run build
          grep -q '<loc>https://deadpixeltest.cc/</loc>' dist/sitemap.xml
          grep -q '<loc>https://deadpixeltest.cc/pt-br</loc>' dist/sitemap.xml
          grep -q 'Sitemap: https://deadpixeltest.cc/sitemap.xml' dist/robots.txt
          grep -q 'rel="canonical" href="https://deadpixeltest.cc/"' dist/index.html
          grep -q 'rel="canonical" href="https://deadpixeltest.cc/pt-br"' dist/pt-br.html
          ! grep -q 'noindex,nofollow' dist/index.html
          ! grep -q 'noindex,nofollow' dist/pt-br.html
          test "$(grep -o '<loc>' dist/sitemap.xml | wc -l | tr -d ' ')" -eq 50
      - name: Build configured SEO origin using test-only domain
        env:
          PUBLIC_SITE_URL: https://deadpixeltest.example
        run: npm run build
      - name: Check priority HTML and sitemap
        run: |
          test -s dist/index.html
          test -s dist/tests/refresh-rate.html
          test -s dist/tests/local-dimming.html
          test -s dist/tests/color-gradient.html
          test -s dist/pt-br.html
          test -s dist/pt-br/pixel-morto-notebook.html
          grep -q 'tests/local-dimming' dist/sitemap.xml
          grep -q 'laptop-screen-dead-pixel-test' dist/sitemap.xml
          grep -q 'pt-br/pixel-morto-notebook' dist/sitemap.xml
          ! grep -q 'noindex,nofollow' dist/pt-br/pixel-morto-notebook.html
      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run browser checks
        env:
          PUBLIC_SITE_URL: https://deadpixeltest.example
          SMOKE_BASE: http://127.0.0.1:4321
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/astro-preview.log 2>&1 &
          sleep 4
          npm run smoke:browser
          npm run smoke:crossbrowser
          npm run smoke:legacy
      - name: Upload desktop and mobile design screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-screenshots
          path: |
            smoke-screenshots/site-*.png
            smoke-screenshots/home-desktop.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Print Astro preview logs on failure
        if: failure()
        run: cat /tmp/astro-preview.log || true
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-browser-screenshots
          path: |
            smoke-screenshots/failure-*.png
            smoke-screenshots/cross-*.png
          if-no-files-found: ignore
          retention-days: 7
